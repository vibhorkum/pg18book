version: '3.8'

services:
  postgres-prod:
    build:
      context: ../postgresql
      dockerfile: Dockerfile
    container_name: pg18book-prod
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - postgres_prod_logs:/var/log/postgresql
      - postgres_prod_backup:/var/backups/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      
      # Production Performance Configuration (High performance)
      PG_SHARED_BUFFERS: 2GB
      PG_EFFECTIVE_CACHE_SIZE: 8GB
      PG_WORK_MEM: 16MB
      PG_MAINTENANCE_WORK_MEM: 512MB
      PG_MAX_CONNECTIONS: 200
      PG_RANDOM_PAGE_COST: 1.1
      PG_EFFECTIVE_IO_CONCURRENCY: 200
      
      # Production Replication Configuration
      PG_WAL_LEVEL: logical
      PG_MAX_REPLICATION_SLOTS: 20
      PG_MAX_WAL_SENDERS: 20
      PG_MAX_LOGICAL_REPLICATION_WORKERS: 8
      PG_MAX_WAL_SIZE: 4GB
      PG_MIN_WAL_SIZE: 1GB
      PG_CHECKPOINT_TIMEOUT: 15min
      PG_CHECKPOINT_COMPLETION_TARGET: 0.9
      
      # Production Logging Configuration (Minimal)
      PG_LOGGING_COLLECTOR: "on"
      PG_LOG_DIRECTORY: /var/log/postgresql
      PG_LOG_FILENAME: postgresql-prod-%Y-%m-%d.log
      PG_LOG_MIN_DURATION_STATEMENT: 5000
      PG_LOG_ROTATION_AGE: 1d
      PG_LOG_ROTATION_SIZE: 500MB
      PG_LOG_TRUNCATE_ON_ROTATION: "on"
      
      # Security and Monitoring
      PG_LOG_CONNECTIONS: "on"
      PG_LOG_DISCONNECTIONS: "on"
      PG_LOG_CHECKPOINTS: "on"
    networks:
      - pg18book-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 12G
          cpus: '4.0'
        reservations:
          memory: 8G
          cpus: '2.0'

volumes:
  postgres_prod_data:
    driver: local
  postgres_prod_logs:
    driver: local
  postgres_prod_backup:
    driver: local

networks:
  pg18book-prod:
    driver: bridge
