version: '3.8'

services:
  db:
    image: vibhorkumar123/pg18-vector:v2.2
    container_name: pg18book
    ports:
      - "5432:5432"
    restart: always
    shm_size: 128mb
    volumes:
      # Persistent data storage
      # - pg_data:/var/lib/postgresql/data
      # Log storage
      - pg_logs:/var/log/postgresql
      # Optional: custom configuration files
      # - ./custom-config:/etc/postgresql/custom
    environment:
      # Basic PostgreSQL settings
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      
      # Memory and Performance Configuration
      PG_SHARED_BUFFERS: 256MB
      PG_EFFECTIVE_CACHE_SIZE: 1GB
      PG_WORK_MEM: 4MB
      PG_MAINTENANCE_WORK_MEM: 64MB
      PG_RANDOM_PAGE_COST: 1.1
      PG_EFFECTIVE_IO_CONCURRENCY: 200
      
      # Connection and Worker Settings
      PG_MAX_CONNECTIONS: 100
      PG_MAX_WORKER_PROCESSES: 20
      PG_MAX_PARALLEL_WORKERS: 8
      PG_MAX_PARALLEL_WORKERS_PER_GATHER: 2
      PG_MAX_PARALLEL_MAINTENANCE_WORKERS: 2
      
      # Replication and Logical Replication Settings
      PG_WAL_LEVEL: logical
      PG_MAX_REPLICATION_SLOTS: 10
      PG_MAX_WAL_SENDERS: 10
      PG_HOT_STANDBY: on
      PG_MAX_LOGICAL_REPLICATION_WORKERS: 10
      
      # WAL and Checkpointing
      PG_MAX_WAL_SIZE: 2GB
      PG_CHECKPOINT_TIMEOUT: 10min
      
      # Logging Configuration
      PG_LOG_DESTINATION: stderr
      PG_LOGGING_COLLECTOR: on
      PG_LOG_DIRECTORY: /var/log/postgresql
      PG_LOG_FILENAME: postgresql-%Y-%m-%d.log
      PG_LOG_ROTATION_AGE: 1d
      PG_LOG_ROTATION_SIZE: 100MB
      PG_LOG_MIN_DURATION_STATEMENT: 50
      PG_LOG_STATEMENT: ddl
      PL_LOG_CHECKPOINTS: on
      PL_LOG_DEADLOCKS: on
      PG_LOG_DEADLOCKTIMEOUT: 1000
      PK_LOG_TEMP_FILES: on
      PG_LOG_CHECKPOINTS: on
      PG_LOG_AUTOVACUUM: on

      PG_LOG_LINE_PREFIX: "%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h "
      
      # Network Settings
      PG_LISTEN_ADDRESSES: "*"
      PG_PORT: 5432
      
      # Autovacuum Settings
      PG_AUTOVACUUM: on
      PG_AUTOVACUUM_MAX_WORKERS: 3
      
      # Archive Settings (disabled by default)
      PG_ARCHIVE_MODE: off
      PG_ARCHIVE_COMMAND: ""
      
      # SSL Settings (disabled by default)
      PG_SSL: off
    
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/pgsql/bin/pg_isready -h localhost -p 5432 -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Optional: resource limits
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 512M
          cpus: '0.5'

volumes:
  pg_data:
    driver: local
  pg_logs:
    driver: local

networks:
  default:
    name: postgres_network
